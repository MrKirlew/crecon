# ==================== AI Executive Assistant - Site Configuration ====================
# PWA serving + API proxy + Security headers + TLS termination

# Upstream definitions for backend services
upstream fastapi_backend {
    server fastapi:8000;
    keepalive 32;
}

upstream n8n_backend {
    server n8n:5678;
    keepalive 16;
}

# ==================== HTTP Server (Redirect to HTTPS) ====================
server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==================== HTTPS Server ====================
server {
    listen 443 ssl http2;
    server_name _;

    # ==================== SSL/TLS Configuration ====================
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Strong SSL configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ==================== Security Headers (HTTPS-specific) ====================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy (CSP) for PWA
    # Adjust based on your PWA's specific requirements
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.openai.com https://api.anthropic.com; worker-src 'self' blob:; manifest-src 'self';" always;

    # Permissions Policy (formerly Feature Policy)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ==================== PWA Static Files ====================
    # Root location serves the PWA frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # General caching for static assets with hashes
        location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ==================== Critical PWA Files (No Cache) ====================
    # Service Worker - MUST be served with no-cache to enable updates
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        add_header Service-Worker-Allowed "/";
    }

    # PWA Manifest - No cache to ensure installability updates
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        add_header Content-Type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Index HTML - No cache to ensure app shell updates
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # ==================== FastAPI AI Agent Proxy ====================
    location /api/ {
        proxy_pass http://fastapi_backend;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for LLM operations (can be long)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering configuration
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 32 32k;
        proxy_busy_buffers_size 128k;

        # WebSocket support (if needed for streaming)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ==================== N8N Webhook Proxy ====================
    # Internal only - not exposed to public internet
    location /webhook/ {
        # Optional: Restrict to internal Docker network only
        # allow 172.28.0.0/16;
        # deny all;

        proxy_pass http://n8n_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for workflow execution
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 16 32k;
    }

    # ==================== N8N UI (Optional - for admin access) ====================
    # Uncomment to enable access to N8N's web interface
    # WARNING: Ensure strong authentication is configured
    # location /n8n/ {
    #     proxy_pass http://n8n_backend/;
    #
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    # }

    # ==================== Health Check Endpoint ====================
    location /health {
        proxy_pass http://fastapi_backend/health;
        access_log off;
    }

    # ==================== Error Pages ====================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
