# Development Override Configuration
# Use with: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

version: '3.8'

services:
  # FastAPI - Development mode with hot reload
  fastapi:
    build:
      context: ./backend
      target: builder  # Use builder stage for dev tools
    volumes:
      - ./backend:/app  # Mount source for hot reload
    environment:
      - DEBUG=true
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Nginx - Expose additional ports for debugging
  nginx:
    ports:
      - "8080:80"  # HTTP on alternative port

  # N8N - Expose UI for development
  n8n:
    ports:
      - "5678:5678"  # Direct access to N8N UI

  # Qdrant - Expose UI
  qdrant:
    ports:
      - "6333:6333"
      - "6334:6334"

  # PostgreSQL - Expose for direct access
  postgres:
    ports:
      - "5432:5432"

  # Redis - Expose for debugging
  redis:
    ports:
      - "6379:6379"
    profiles: []  # Always start in dev mode

  # Langfuse - Always enabled in dev
  langfuse:
    ports:
      - "3000:3000"
    profiles: []  # Always start in dev mode
